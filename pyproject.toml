[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-ticket-agent"
version = "0.1.0"
description = "A ReAct agent over a RAG knowledge base that triages and routes support tickets into a structured decision object."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hardik Chhatwal" }]
dependencies = [
    "pydantic-ai-slim[openai]>=0.0.30",
    "pydantic>=2.6",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
support-agent = "support_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
